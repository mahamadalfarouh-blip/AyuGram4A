name: Build fork APK (arm64)
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # نفس القيم العامة التي يستخدمها مستودع AyuGram الأصلي في سير عمله المنشور للعلن (ليست سرية)
      - uses: DamianReeves/write-file-action@master
        with:
          path: ./API_KEYS
          contents: |
            APP_ID = 6
            APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
            MAPS_V2_API = ""
          write-mode: overwrite

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;21.4.7075529" --sdk_root=${ANDROID_SDK_ROOT}

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet/
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26*
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (arm64 release, signed with fork keystore)
        run: ./gradlew assembleArm64Release --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-fork-arm64
          path: TMessagesProj/build/outputs/apk/arm64/release/*.apk
